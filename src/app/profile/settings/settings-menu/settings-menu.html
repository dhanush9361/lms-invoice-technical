<section class="flex h-[calc(100vh-4.5rem)] flex-col px-5 pb-5 pt-1">

  <!-- Single wrapper animation, so the tab and card never separate -->
  <div class="flex min-h-0 flex-1 flex-col animate-[settings-fade-up_500ms_cubic-bezier(0.2,0.75,0.25,1)_both]">

    <!-- Top row: heading (left) + folder tab (right) -->
    <div class="flex flex-col gap-4 lg:h-[78px] lg:flex-row lg:items-stretch lg:gap-0">

      <!-- Page heading -->
      <div class="shrink-0 lg:w-[28%] lg:min-w-[320px] lg:pr-6">
        <h1 class="text-2xl font-bold leading-8 text-[#444]">Settings</h1>
        <p class="mt-1.5 text-[15px] text-[#555]">
          Manage all our settings at one place
        </p>
      </div>

      <!-- White folder tab -->
      <div class="relative flex min-w-0 flex-1 items-center rounded-t-2xl bg-white px-5 py-3 lg:px-11 lg:py-0">

        <!-- Inverse curve joining the tab with the card -->
        <span
          class="pointer-events-none absolute bottom-0 right-full hidden h-4 w-4 bg-[radial-gradient(circle_at_top_left,transparent_15.5px,#fff_16px)] lg:block"
          aria-hidden="true"
        ></span>

        <!-- Previous arrow (design only, not clickable) -->
        <span
          class="pointer-events-none grid h-8 w-8 shrink-0 place-items-center rounded-full bg-[#f5f5f5] text-[#a8d8df]"
          aria-hidden="true"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 6-6 6 6 6" />
          </svg>
        </span>

        <!-- Tabs -->
        <div
          role="tablist"
          aria-label="Settings sections"
          class="mx-4 flex min-w-0 flex-1 items-center justify-between gap-10 overflow-x-auto lg:mx-8 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
        >
          @for (tab of tabs; track tab.id) {
            <button
              type="button"
              role="tab"
              [attr.aria-selected]="activeTab() === tab.id"
              [attr.aria-disabled]="!tab.enabled"
              [disabled]="!tab.enabled"
              (click)="selectTab(tab)"
              class="shrink-0 whitespace-nowrap rounded px-1 py-1.5 text-lg font-medium outline-none transition-colors duration-300 focus-visible:ring-2 focus-visible:ring-[#4694A4]/40 motion-reduce:transition-none"
              [class]="activeTab() === tab.id
                ? 'text-[#444]'
                : tab.enabled
                  ? 'cursor-pointer text-[#aaa] hover:text-[#666]'
                  : 'cursor-default text-[#aaa]'"
            >
              {{ tab.label }}
            </button>
          }
        </div>

        <!-- Next arrow (design only, not clickable) -->
        <span
          class="pointer-events-none grid h-8 w-8 shrink-0 place-items-center rounded-full bg-[#f5f5f5] text-[#4eb3c4]"
          aria-hidden="true"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 6 6 6-6 6" />
          </svg>
        </span>
      </div>
    </div>

    <!-- White card -->
    <div class="flex min-h-0 flex-1 flex-col rounded-b-2xl bg-white p-5 lg:rounded-tl-2xl lg:px-9 lg:pb-[29px] lg:pt-8">

      <!-- Grey content panel -->
      <div class="min-h-0 flex-1 overflow-y-auto rounded-2xl bg-[#f5f5f5] px-9 pb-9 pt-[38px]">
        @switch (activeTab()) {

          @case ('general') {
            <div class="animate-[settings-fade-up_450ms_cubic-bezier(0.2,0.75,0.25,1)_both]" role="tabpanel">
              <app-two-fa-verification />
            </div>
          }

          @case ('subscription') {
            <div class="animate-[settings-fade-up_450ms_cubic-bezier(0.2,0.75,0.25,1)_both]" role="tabpanel">
              <h2 class="text-[15px] font-medium text-[#444]">Subscription &amp; Billing</h2>
              <p class="mt-2 text-xs text-[#888]">Coming up next.</p>
            </div>
          }

          @case ('invoice') {
            <div class="animate-[settings-fade-up_450ms_cubic-bezier(0.2,0.75,0.25,1)_both]" role="tabpanel">
              <app-invoice-setup />
            </div>
          }
        }
      </div>
    </div>
  </div>
</section>
